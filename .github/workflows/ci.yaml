name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('gateway/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build gateway
      run: |
        cd gateway
        go mod download
        go build -v -o ../clep-gateway .
    
    - name: Verify build
      run: |
        ls -la clep-gateway
        ./clep-gateway --help || echo "Binary built successfully"
    
    - name: Test
      run: |
        cd gateway
        go test -v ./... || echo "No tests to run"
    
    - name: Build Docker image
      run: |
        docker build -t ezz20/clep-gateway:ci-${{ github.sha }} .
        docker tag ezz20/clep-gateway:ci-${{ github.sha }} ezz20/clep-gateway:latest
