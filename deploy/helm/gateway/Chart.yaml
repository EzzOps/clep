apiVersion: v1
kind: Chart
metadata:
  name: clep-gateway
  version: 0.1.0
  appVersion: 1.0.0
  description: CLEP Gateway - Plane webhook receiver and event router
  keywords:
    - clep
    - plane
    - hermes
    - kubernetes
    - nats
  maintainers:
    - name: Ezz Ashraf AboAlhamed
      email: ezzashraf444@gmail.com
  sources:
    - https://github.com/EzzOps/clep
  annotations:
    artifacthub.io/category: integration-delivery
    artifacthub.io/license: MIT

type: application

dependencies:
  - name: nats
    version: 1.1.0
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
    alias: nats

values:
  replicaCount: 1
  image:
    repository: ezzops/clep-gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: clep.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  env:
    PORT: "8080"
    NATS_URL: "nats://nats-nats-cluster.clep.svc.cluster.local:4222"
    PLANE_API_URL: ""
    PLANE_API_KEY: ""
    PLANE_WEBHOOK_SECRET: ""
    DATABASE_URL: ""
    HERMES_ADAPTER_URL: "http://hermes-adapter.clep.svc.cluster.local:8081"
    EVENT_STREAM: "clep.events"
    RESPONSE_STREAM: "clep.responses"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  nats:
    enabled: false
