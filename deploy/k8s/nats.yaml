apiVersion: v1
kind: Namespace
metadata:
  name: clep
  labels:
    app.kubernetes.io/name: clep
    app.kubernetes.io/instance: clep
    app.kubernetes.io/component: namespace
    control-plane: clep

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: clep
  labels:
    app.kubernetes.io/name: clep
    app.kubernetes.io/instance: clep
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clep
      app.kubernetes.io/instance: clep
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clep
        app.kubernetes.io/instance: clep
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitoring
              containerPort: 8222
              protocol: TCP
          args:
            - --jetstream
            - --store_dir
            - /data
            - --http_port
            - "8222"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: monitoring
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nats-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-pvc
  namespace: clep
  labels:
    app.kubernetes.io/name: clep
    app.kubernetes.io/instance: clep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: clep
  labels:
    app.kubernetes.io/name: clep
    app.kubernetes.io/instance: clep
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
    - name: monitoring
      port: 8222
      targetPort: monitoring
      protocol: TCP
  selector:
    app.kubernetes.io/name: clep
    app.kubernetes.io/instance: clep
    app.kubernetes.io/component: nats
