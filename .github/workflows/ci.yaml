name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Build gateway
      run: |
        cd gateway
        go mod download
        go build -v ./...
    
    - name: Test
      run: |
        cd gateway
        go test -v ./...
    
    - name: Build Docker image
      run: |
        docker build -t ezz20/clep-gateway:ci-${{ github.sha }} .
    
    - name: Deploy to Kubernetes
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Deployment handled by deploy workflow"
